name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release --nologo
      - run: dotnet run --project tests/ServerAuditTests.csproj -c Release
      - run: pwsh -File tests/Test-Release.ps1
      - run: pwsh -File tests/Test-UI.ps1
      - run: pwsh -File tests/Test-SigningPath.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: OpenServerOps-win-x64
          path: test-output/release-*/
