name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release --nologo
      - run: pwsh -File tests/Test-Release.ps1
      - run: pwsh -File tests/Test-UI.ps1
      - run: pwsh -File tests/Test-SigningPath.ps1
      - run: pwsh -File tools/Verify-Release.ps1 -Executable bin/x64/Release/net10.0-windows/OpenServerOps.exe
